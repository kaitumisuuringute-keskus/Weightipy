site_name: Weightipy documentation
site_description: Weightipy is a modernized, lightweight, and high-performance library for weighting survey data using the RIM (iterative raking) algorithm.
site_author: Remi Sebastian Kits
site_url: https://kaitumisuuringute-keskus.github.io/Weightipy

repo_name: kaitumisuuringute-keskus/Weightipy
repo_url: https://github.com/kaitumisuuringute-keskus/Weightipy

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

  font:
    text: system-ui
    code: JetBrains Mono
  
  palette:
    - scheme: default        # light mode: white + neutral gray + black
      primary: black         # used for links, accents
      accent: gray
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate          # dark mode: near-black + muted gray
      primary: black
      accent: gray
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  
  # Use simple, thin borders + flat feel
  shadows:
    elevation:
      dp1: "0 0 0 1px rgba(15,23,42,.06)"
      dp2: "0 0 0 1px rgba(15,23,42,.08)"
      dp3: "0 0 0 1px rgba(15,23,42,.12)"

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_signature: true
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            group_by_category: false
            show_category_heading: true
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - API Reference:
    - Scheme creation: api/scheme.md
    - Weighting: api/weight.md
    - Scheme validation: api/validate.md
    - Types: api/types.md
    - Internals:
      - Helpers: api/internal/helpers.md
      - Rim class: api/internal/rim.md
      - WeightEngine class: api/internal/weight_engine.md
  - Examples:
    - Nested schemes: examples/nested-schemes.md

extra_javascript:
  - static/plausible.js
extra_css:
  - static/shadcn-ish.css